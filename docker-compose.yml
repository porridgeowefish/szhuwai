services:
  backend:
    build: ./backend
    restart: unless-stopped
    # 把 backend/.env 注入容器环境变量（AMAP/QWEATHER/SEARCH 等 key）。
    # 不加这一行，容器里所有 key 为空，/plan/generate 会全部降级。
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - outdoor-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - outdoor-network

networks:
  outdoor-network:
    driver: bridge
